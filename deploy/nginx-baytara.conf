# Baytara - Main Website (static SPA) + Admin Portal (/admin) + API (/api -> gunicorn).
# Live copy: /etc/nginx/sites-enabled/baytara
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name baytara.app;

    ssl_certificate     /etc/letsencrypt/live/baytara.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baytara.app/privkey.pem;

    server_tokens off;
    include /etc/nginx/snippets/baytara-security.conf;
    include /etc/nginx/snippets/baytara-cloudflare-realip.conf;

    root /var/www/baytara;
    index index.html;

    # Anonymous playback attempts are audited. Throttle this path before it
    # reaches Gunicorn so unauthenticated traffic cannot flood audit storage.
    location = /api/v1/video/playback {
        limit_req zone=baytara_video_playback burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API -> Flask/Gunicorn backend
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # video uploads go through this proxy; the app enforces its own MAX_UPLOAD_MB
        client_max_body_size 4096m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Admin Portal SPA (built with base=/admin/)
    location /admin/ {
        include /etc/nginx/snippets/baytara-security.conf;
        add_header Cache-Control "no-store, must-revalidate" always;  # HTML always fresh
        alias /var/www/baytara-admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Instructor Portal SPA (built with base=/instructor/)
    location /instructor/ {
        include /etc/nginx/snippets/baytara-security.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        alias /var/www/baytara-instructor/;
        try_files $uri $uri/ /instructor/index.html;
    }

    # App Links / Universal Links association files.
    #
    # These are what make https://baytara.app/library/<slug> open the Android or iOS app
    # for someone who has it installed, and the website for everyone else. They need an
    # explicit block for two reasons: apple-app-site-association has no file extension and
    # must still be served as application/json, and without `=404` a missing file would
    # fall through to the SPA and answer with index.html - so the verifier would report a
    # JSON parse error rather than "not published yet".
    #
    # Generated by deploy/gen_applinks.sh into the site's public/ directory; they cannot be
    # written by hand because they carry the release signing fingerprint and the Apple team
    # id.
    location = /.well-known/assetlinks.json {
        include /etc/nginx/snippets/baytara-security.conf;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location = /.well-known/apple-app-site-association {
        include /etc/nginx/snippets/baytara-security.conf;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # A shared article or book summary: Flask serves the same index.html with that item's
    # own title, summary and cover in the head, so WhatsApp/Facebook/X show a real card
    # (backend/app/api/share.py). If the API errors, is down, or predates that route (404),
    # the static shell is served instead, exactly as the SPA location below would, so the
    # page is never lost to this.
    location ~ ^/(blog|library)/[^/]+/?$ {
        include /etc/nginx/snippets/baytara-security.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa_shell;
    }

    location @spa_shell {
        include /etc/nginx/snippets/baytara-security.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # Main Website SPA fallback (React Router). HTML must never be cached so the
    # browser always picks up the current hashed bundle.
    location / {
        include /etc/nginx/snippets/baytara-security.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable - safe to cache forever (this location
    # sets its own add_header, so re-include the security snippet).
    location /assets/ {
        include /etc/nginx/snippets/baytara-security.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.baytara.app;

    ssl_certificate     /etc/letsencrypt/live/baytara.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baytara.app/privkey.pem;

    server_tokens off;
    include /etc/nginx/snippets/baytara-security.conf;
    include /etc/nginx/snippets/baytara-cloudflare-realip.conf;

    return 301 https://baytara.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name baytara.mubarmijonline.com;

    ssl_certificate     /etc/nginx/certs/elamal.pem;
    ssl_certificate_key /etc/nginx/certs/elamal.key;

    server_tokens off;
    include /etc/nginx/snippets/baytara-security.conf;
    include /etc/nginx/snippets/baytara-cloudflare-realip.conf;

    return 301 https://baytara.app$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name baytara.app www.baytara.app baytara.mubarmijonline.com;

    root /var/www/baytara;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://baytara.app$request_uri;
    }
}
