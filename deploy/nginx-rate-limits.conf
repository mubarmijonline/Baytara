# Shared across every Gunicorn worker. Installed in /etc/nginx/conf.d/.
# An empty key disables limiting, so signed-in customers are not grouped by IP.
map $http_authorization $baytara_anonymous_playback_key {
    default "";
    ""      $binary_remote_addr;
}

limit_req_zone $baytara_anonymous_playback_key zone=baytara_video_playback:10m rate=5r/m;
