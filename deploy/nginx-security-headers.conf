# Baytara security headers. Installed at /etc/nginx/snippets/baytara-security.conf
# and `include`d in the server block + the /assets location (nginx add_header does not
# inherit into a location that sets its own add_header, so it must be repeated there).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP: self by default; inline styles (React) + Google Fonts; images from any https (admin-set
# course/cover URLs); the VdoCipher DRM player iframe; API is same-origin (connect-src 'self').
# Sign In With Google needs its four hosts: the client script, the button/One Tap
# iframe under /gsi/, its endpoints, and the button stylesheet.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://player.vdocipher.com https://static.cloudflareinsights.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://cloudflareinsights.com https://*.amazonaws.com https://accounts.google.com/gsi/; frame-src 'self' https://player.vdocipher.com https://accounts.google.com/gsi/; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
