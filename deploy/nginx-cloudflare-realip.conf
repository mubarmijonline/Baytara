# Restore the real visitor IP behind Cloudflare.
#
# DNS for baytara.app is proxied through Cloudflare, so the TCP peer nginx sees is a
# Cloudflare edge address, not the viewer. Without this, $remote_addr -- and therefore
# the X-Real-IP the API is given -- is Cloudflare's. That matters in three places:
#
#   * POST /video/playback pins each VdoCipher OTP to the viewer's IP (ipGeo). Pinned
#     to a Cloudflare address instead, the viewer's own player is refused and protected
#     playback fails for everyone.
#   * the dynamic watermark burns the IP into the picture, to identify a leak.
#   * video_playback_sessions records it as the audit trail.
#
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6, fetched 2026-09-15.
# Cloudflare adds ranges occasionally; refresh this file if traffic starts arriving from
# an address these do not cover (the access log will show the edge IP again).
# Scoped to the Baytara server blocks on purpose -- other sites on this host keep their
# own $remote_addr semantics.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;
