name: baytara
description: Baytara — Arabic veterinary learning platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + routing
  flutter_riverpod: 3.4.2
  go_router: 17.5.0

  # Network + storage
  dio: 5.11.0
  # 10.3.1, not 11.0.0: v11 requires compileSdk 37, and Android 37 now ships as the
  # "minor version" platform android-37.0 which the current AGP cannot resolve
  # (it looks for android-37). 10.3.1 targets compileSdk 36 and builds cleanly.
  flutter_secure_storage: 10.3.1

  # Device identity (see core/storage/device_id.dart — generated once, never regenerated)
  uuid: 4.6.0
  package_info_plus: 10.2.1

  # DRM playback. The player widget is VdoPlayer, fed EmbedInfo.streaming(otp:, playbackInfo:)
  # from POST /video/playback. Never cache an OTP: single-session, short-lived, and the
  # server counts every mint against a 40/hour ceiling.
  vdocipher_flutter: 2.8.5

  # NOTE: screen_protector was evaluated and deliberately NOT used. It only wraps
  # FLAG_SECURE, which MainActivity already sets natively, and it does not do the thing
  # that actually matters on Android: ALLOW_CAPTURE_BY_NONE, which silences the audio in a
  # recording. It also fails to compile against this AGP/Kotlin combination. The native
  # implementation in android/.../MainActivity.kt is the source of truth.

  # Hosted checkout. The gateway URL opens in a Custom Tab / SFSafariViewController, NOT a
  # bare WebView and never the VdoCipher WebView: a payment page in an app-controlled
  # WebView is both a security problem and a store-review one.
  flutter_custom_tabs: 2.6.0

  # App Links / Universal Links, to catch the gateway's redirect back to
  # https://baytara.app/payment/callback.
  app_links: 7.2.1

  # Camera and gallery, for the verification document captures.
  image_picker: 1.2.3

  # Google sign-in. v7 is instance-based: GoogleSignIn.instance.initialize() then
  # .authenticate(); the id token comes off account.authentication.idToken and is what
  # POST /auth/google wants as `credential`.
  google_sign_in: 7.2.0

  # Declared rather than relied on transitively via dio: MultipartFile needs MediaType to
  # label the uploaded card sides, and an implicit dependency is one a dio upgrade can drop.
  http_parser: any

  # Opening the privacy policy, about and contact pages in the browser rather than
  # reimplementing them natively.
  url_launcher: 6.3.2

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generate the launcher icon and the native splash from the brand assets. Both are
  # build-time only: they write into android/ and ios/ and are not shipped in the app.
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

# Launcher icon, from brand_identity/Logo/PNG/Icon.png.
#
# adaptive_icon_background is the navy rather than white: Android composites the foreground
# over it and crops to whatever mask the launcher uses, so a white plate would show as a
# white square on some devices and a circle on others.
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#141E42"
  adaptive_icon_foreground: assets/brand/icon_adaptive_foreground.png

# Native splash: what the OS shows before Flutter has started, so it cannot be a widget.
# Without it the user sees a white flash, then the app.
flutter_native_splash:
  color: "#141E42"
  image: assets/brand/wordmark_white.png
  android_12:
    color: "#141E42"
    image: assets/brand/icon.png
    icon_background_color: "#141E42"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/

  fonts:
    # Brand faces, copied from brand_identity/Fonts and frontend/web/public/fonts.
    # Weights mirror the @font-face block in frontend/web/src/theme/global.css exactly,
    # so a screen looks the same in the app as it does on the site.
    - family: Thmanyah
      fonts:
        - asset: assets/fonts/thmanyahsans-Light.otf
          weight: 300
        - asset: assets/fonts/thmanyahsans-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyahsans-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyahsans-Black.otf
          weight: 900
    - family: Stolzl
      fonts:
        - asset: assets/fonts/stolzl_book.otf
          weight: 400
        - asset: assets/fonts/stolzl_medium.otf
          weight: 500
        - asset: assets/fonts/stolzl_bold.otf
          weight: 700
